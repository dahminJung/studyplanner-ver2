<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-logo">Study<span>Planner</span></div>
        <div class="nav-right">
            <div class="nav-links">
                <button id="nav-planner" class="nav-btn active">📝 플래너</button>
                <button id="nav-stats" class="nav-btn">📊 통계</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" title="테마 변경">🌓</button>
        </div>
    </nav>

    <div class="app-container">
        <!-- ============================== -->
        <!-- 플래너 페이지 (Main) -->
        <!-- ============================== -->
        <div id="planner-page" class="page-content active">
            <div class="planner-layout">
                
                <!-- Left: Time Table -->
                <div class="timetable-section">
                    <div class="section-header">
                        <h2>Time Table</h2>
                        <span class="subtitle">06:00 ~ 24:00</span>
                    </div>
                    <div class="time-grid-container" id="time-grid-container">
                        <!-- JS에서 동적 생성됨 -->
                    </div>
                </div>

                <!-- Right: Sidebar -->
                <div class="sidebar-section">
                    
                    <!-- Subjects -->
                    <div class="box subjects-box">
                        <h2>과목 관리</h2>
                        <div class="add-subject">
                            <input type="text" id="subject-name" placeholder="과목명 입력">
                            <div class="color-palette" id="color-palette">
                                <button class="color-btn active" style="background-color: #ffb3ba;" data-color="#ffb3ba"></button>
                                <button class="color-btn" style="background-color: #ffdfba;" data-color="#ffdfba"></button>
                                <button class="color-btn" style="background-color: #ffffba;" data-color="#ffffba"></button>
                                <button class="color-btn" style="background-color: #baffc9;" data-color="#baffc9"></button>
                                <button class="color-btn" style="background-color: #bae1ff;" data-color="#bae1ff"></button>
                                <button class="color-btn" style="background-color: #e8baff;" data-color="#e8baff"></button>
                            </div>
                            <button id="add-subject-btn" class="btn primary">추가</button>
                        </div>
                        <ul id="subject-list" class="subject-list"></ul>
                    </div>

                    <!-- To-Do List -->
                    <div class="box todo-box">
                        <h2>To-Do List</h2>
                        <div class="add-todo">
                            <input type="text" id="todo-input" placeholder="할 일 입력">
                            <select id="todo-subject-select">
                                <option value="">과목 선택</option>
                            </select>
                            <button id="add-todo-btn" class="btn primary">+</button>
                        </div>
                        <ul id="todo-list" class="todo-list"></ul>
                    </div>

                    <!-- Smart Timer -->
                    <div class="box timer-box">
                        <h2>학습 타이머</h2>
                        <div class="timer-display" id="timer-display">00:00:00</div>
                        <div class="timer-controls">
                            <button id="timer-start" class="btn primary">시작</button>
                            <button id="timer-stop" class="btn warning" disabled>정지</button>
                            <button id="timer-reset" class="btn secondary">초기화</button>
                        </div>
                        <div class="timer-save-area" id="timer-save-area" style="display: none;">
                            <select id="timer-subject-select"></select>
                            <button id="timer-save-btn" class="btn primary">시간 기록</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- ============================== -->
        <!-- 통계 페이지 (Stats) -->
        <!-- ============================== -->
        <div id="stats-page" class="page-content">
            <div class="stats-layout">
                <h2>학습 통계 리포트</h2>
                
                <div class="stats-overview">
                    <div class="stat-card">
                        <span class="stat-label">총 학습 시간</span>
                        <strong class="stat-value" id="total-time-val">0h 0m</strong>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">To-Do 달성률</span>
                        <strong class="stat-value" id="todo-rate-val">0%</strong>
                    </div>
                </div>

                <div class="charts-wrapper">
                    <div class="chart-box">
                        <h3>과목별 학습 비율</h3>
                        <div class="pie-chart" id="pie-chart"></div>
                        <ul class="chart-legend" id="chart-legend"></ul>
                    </div>
                    <div class="chart-box">
                        <h3>과목별 학습 시간</h3>
                        <div class="bar-chart" id="bar-chart"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 미니 팝업 (시간표 과목 배정) -->
    <div id="subject-popup" class="subject-popup">
        <div class="popup-title">배정할 과목 선택</div>
        <div id="popup-colors" class="popup-colors">
            <!-- JS에서 과목 색상 동그라미들이 동적으로 들어갑니다 -->
        </div>
        <div class="popup-actions">
            <button id="popup-clear" class="btn warning small">지우기</button>
            <button id="popup-close" class="btn secondary small">닫기</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
